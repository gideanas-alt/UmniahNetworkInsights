name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Umniah Network Insights
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"

      - name: Show Android environment
        run: |
          echo "JAVA:"
          java -version

          echo "ANDROID SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "INSTALLED SDK PACKAGES:"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Show Gradle
        run: |
          gradle --version

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Locate generated APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Umniah-Network-Insights-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
